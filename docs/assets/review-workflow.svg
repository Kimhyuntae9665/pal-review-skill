<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">PAL Review: 외부 의견을 근거로 확인하고 개선하는 흐름</title>
<desc id="desc">자료를 검사해 PAL MCP로 보내고 최대 네 모델의 독립 검토를 받습니다. 선택한 debate에서는 1차 성공 검토자가 두 명 이상일 때 한 차례 상호 비평합니다. Codex가 근거를 확인해 채택, 기각, 미해결을 기록하고 사용자 범위 안에서 수정과 검증을 수행합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#168277" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#152b3a}.eyebrow{font-size:16px;font-weight:700;letter-spacing:2px;fill:#168277}.heading{font-size:37px;font-weight:700;letter-spacing:-1.2px}.body{font-size:20px;fill:#526675}.label{font-size:23px;font-weight:700;letter-spacing:-.5px}.small{font-size:18px;fill:#526675}.tiny{font-size:16px;fill:#526675}.number{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#168277}.model{font-family:Arial,sans-serif;font-size:21px;font-weight:700}.edge{fill:none;stroke:#168277;stroke-width:2.2;marker-end:url(#arrow)}.card{fill:#fff;stroke:#cfdee0;stroke-width:1.5}</style></defs>
<rect width="1200" height="1080" rx="22" fill="#f5f8f8"/>
<text class="eyebrow" x="54" y="52">PAL REVIEW / HOW IT WORKS</text><text class="heading" x="54" y="105">다른 모델의 의견, 근거로 확인한 개선</text><text class="body" x="54" y="145">외부 모델은 검토하고, Codex는 근거를 확인해 수정·검증합니다.</text><path d="M54 174H1146" stroke="#d8e3e5"/>
<rect class="card" x="54" y="206" width="332" height="139" rx="14"/><text class="number" x="76" y="239">01</text><text class="label" x="113" y="241">검토할 자료 지정</text><text class="small" x="76" y="280">작업 설명 + 선택한 결과물</text><text class="tiny" x="76" y="311">파일을 자동으로 훑지 않습니다.</text>
<rect class="card" x="434" y="206" width="332" height="139" rx="14"/><text class="number" x="456" y="239">02</text><text class="label" x="493" y="241">전송 전 조건 확인</text><text class="small" x="456" y="280">입력·인증·무료 조건</text><text class="tiny" x="456" y="311">비밀정보 직접 확인도 필요합니다.</text>
<rect x="814" y="206" width="332" height="139" rx="14" fill="#e8f4f0" stroke="#99c9bc" stroke-width="1.5"/><text class="number" x="836" y="239">03</text><text class="label" x="873" y="241">실제 PAL MCP 호출</text><text class="small" x="836" y="280">공식 API에 검토 요청</text><text class="tiny" x="836" y="311">모델별 호출당 추론 POST 최대 1회</text>
<path class="edge" d="M389 276H425"/><path class="edge" d="M769 276H805"/><path class="edge" d="M980 349V380H600V402"/>
<rect x="54" y="408" width="1092" height="209" rx="16" fill="#152f3d"/><text x="80" y="445" font-size="23" font-weight="700" style="fill:#fff">1차 · 같은 자료를 각자 독립 검토</text><text x="1120" y="445" font-size="17" text-anchor="end" style="fill:#bce5d9">최대 4회</text>
<rect x="80" y="468" width="245" height="83" rx="10" fill="#244451"/><rect x="345" y="468" width="245" height="83" rx="10" fill="#244451"/><rect x="610" y="468" width="245" height="83" rx="10" fill="#244451"/><rect x="875" y="468" width="245" height="83" rx="10" fill="#244451"/>
<text class="model" x="98" y="502" style="fill:#fff">Gemini</text><text x="98" y="532" font-size="17" style="fill:#b9ccd4">Google API</text><text class="model" x="363" y="502" style="fill:#fff">Qwen</text><text x="363" y="532" font-size="17" style="fill:#b9ccd4">Groq API</text><text class="model" x="628" y="502" style="fill:#fff">Nemotron</text><text x="628" y="532" font-size="17" style="fill:#b9ccd4">OpenRouter API</text><text class="model" x="893" y="502" style="fill:#fff">Cohere</text><text x="893" y="532" font-size="17" style="fill:#b9ccd4">OpenRouter API</text>
<text x="80" y="589" font-size="18" style="fill:#d3e4e9">구조화된 지적 + 근거 + 확인 제안 · 외부 검토 모델에는 실행 도구를 제공하지 않습니다.</text>
<path class="edge" d="M600 620V650"/>
<rect x="54" y="656" width="1092" height="120" rx="14" fill="#fff" stroke="#99b8bc" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="78" y="677" width="78" height="28" rx="14" fill="#e8f4f0"/><text x="117" y="697" text-anchor="middle" font-size="15" font-weight="700" style="fill:#168277">선택</text><text class="label" x="174" y="700">debate · 한 차례 상호 비평</text><text class="small" x="78" y="742">1차 성공 검토자가 2명 이상이면, 성공한 모델만 원본 자료 + 검토 의견을 다시 확인</text><text class="tiny" x="1119" y="699" text-anchor="end">전체 최대 8회</text>
<path class="edge" d="M600 780V811"/>
<rect x="54" y="817" width="1092" height="154" rx="16" fill="#fff" stroke="#168277" stroke-width="2"/><circle cx="90" cy="850" r="12" fill="#168277"/><path d="M84 850l4 4 8-9" fill="none" stroke="#fff" stroke-width="2"/><text class="label" x="115" y="859">Codex가 근거를 확인하고, 허용된 범위에서 개선</text><text class="small" x="79" y="901">지적별 채택 / 근거와 함께 기각 / 미해결 기록 → 실제 수정 → 관련 검사 실행</text><text class="tiny" x="79" y="941">검토 의견은 조언입니다. 모델 간 합의가 정확성을 입증하거나 작업 완료를 대신하지 않습니다.</text>
<text class="tiny" x="54" y="1023">자동 재시도·유료 우회 없음</text><text class="tiny" x="1146" y="1023" text-anchor="end">4회·8회는 호출 상한이며 무료 이용 한도가 아닙니다.</text><text x="54" y="1052" font-size="14" style="fill:#738693">구성된 모델 계열을 설명하는 그림입니다. 정확한 모델 ID·제공 상태·인증 조건은 설정과 실행 결과를 확인하세요.</text>
</svg>
