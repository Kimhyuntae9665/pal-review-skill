<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">review와 debate의 차이</title><desc id="desc">review는 최대 네 모델의 한 차례 독립 검토입니다. debate는 같은 원본의 독립 검토 이후 성공한 검토자 두 명 이상일 때 상호 비평 한 차례를 추가하며 전체 최대 여덟 번 호출합니다. 두 방식 모두 Codex의 근거 확인과 실제 수정·검증이 필요합니다.</desc>
  <defs><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#152b3a}.sub{fill:#526675;font-size:19px}.label{font-size:23px;font-weight:700}.mini{font-size:17px;fill:#526675}.pill{fill:#e8f4f0;stroke:#abd2c5;stroke-width:1.4}.flow{fill:none;stroke:#168277;stroke-width:2.2}.large{font-family:Arial,sans-serif;font-size:32px;font-weight:700}</style><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#168277" stroke-width="1.6"/></marker></defs>
  <rect width="1200" height="650" rx="22" fill="#f5f8f8"/>
  <text x="54" y="50" font-size="16" font-weight="700" letter-spacing="2" style="fill:#168277">ONE ROUND OR TWO</text>
  <text x="54" y="102" font-size="36" font-weight="700" letter-spacing="-1">검토를 받을까, 서로의 근거도 확인할까?</text>
  <text class="sub" x="54" y="142">두 방식 모두 같은 결과물을 검토하며, 수정 여부는 Codex가 근거로 판단합니다.</text>
  <rect x="54" y="183" width="531" height="327" rx="16" fill="#fff" stroke="#cfdee0" stroke-width="1.5"/>
  <rect x="615" y="183" width="531" height="327" rx="16" fill="#fff" stroke="#99c9bc" stroke-width="1.5"/>
  <text class="large" x="82" y="231">review</text><text class="mini" x="557" y="230" text-anchor="end">최대 4회</text>
  <text class="large" x="643" y="231">debate</text><text class="mini" x="1118" y="230" text-anchor="end">전체 최대 8회</text>
  <text class="sub" x="82" y="269">여러 관점에서 한 차례 독립 검토</text><text class="sub" x="643" y="269">독립 검토 + 한 차례 상호 비평</text>
  <path d="M82 291H557M643 291H1118" stroke="#e1e9eb"/>
  <rect class="pill" x="82" y="319" width="185" height="68" rx="10"/><text x="174" y="361" text-anchor="middle" font-size="21" font-weight="700">독립 검토</text>
  <path class="flow" d="M278 353H333" marker-end="url(#arr)"/>
  <rect x="345" y="319" width="212" height="68" rx="10" fill="#152f3d"/><text x="451" y="361" text-anchor="middle" font-size="21" font-weight="700" style="fill:#fff">Codex 근거 확인</text>
  <rect class="pill" x="643" y="319" width="210" height="68" rx="10"/><text x="748" y="361" text-anchor="middle" font-size="21" font-weight="700">독립 검토</text>
  <path class="flow" d="M864 353H898" marker-end="url(#arr)"/>
  <rect class="pill" x="909" y="319" width="209" height="68" rx="10"/><text x="1013" y="361" text-anchor="middle" font-size="21" font-weight="700">상호 비평</text>
  <text class="mini" x="82" y="433">제공한 자료를 각 모델이 따로 읽습니다.</text><text class="mini" x="82" y="466">실패·미완료 응답도 상태로 남깁니다.</text>
  <text class="mini" x="643" y="425">조건: 1차 성공 검토자 2명 이상</text><text class="mini" x="643" y="457">성공한 모델만 원본 + 의견을 다시 확인합니다.</text><text class="mini" x="643" y="487">이후 Codex가 근거를 확인합니다.</text>
  <rect x="54" y="539" width="1092" height="69" rx="12" fill="#e6efee"/>
  <text x="79" y="581" font-size="20" font-weight="700">공통 후속 작업</text><text x="273" y="581" font-size="20">채택·기각·미해결 기록 → 허용된 수정 → 실제 검사</text>
  <text x="1146" y="634" text-anchor="end" font-size="14" style="fill:#738693">호출 상한 ≠ 서비스 할당량 · 모델 간 동의 ≠ 사실 검증</text>
</svg>
