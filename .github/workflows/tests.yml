name: Offline regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install the pinned public PAL runtime (downloads packages, no inference)
        run: python scripts/bootstrap.py
      - name: Run unit and actual-PAL integration tests with mocked provider HTTP
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .runtime/venv/Scripts/python.exe -m unittest discover -s tests -v
          else
            .runtime/venv/bin/python -m unittest discover -s tests -v
          fi
